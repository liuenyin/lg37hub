<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <style>
    :root{color-scheme:light;--paper:#f8f5ef;--ink:#443b35;--muted:#796e65;--line:#e7dfd5;--accent:#95604a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
    .page{width:min(100% - 72px,980px);margin:auto}
    header{padding:90px 0 48px}
    h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(42px,6vw,64px);letter-spacing:-2.5px;line-height:1.2}
    h1 span{color:var(--accent);font-style:italic}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
    article{min-width:0;scroll-margin-top:32px}
    .card{height:100%;min-height:224px;display:flex;flex-direction:column;align-items:flex-start;padding:28px;background:#fffcf7;border:1px solid var(--line);border-radius:18px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
    .card:hover{transform:translateY(-4px);border-color:#cfbca9;box-shadow:0 12px 30px #69503b0a}
    .symbol{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:15px;font-family:Georgia,serif;font-size:23px;font-weight:500;letter-spacing:-1px;color:var(--symbol-ink);background:var(--symbol-paper)}
    .rose{--symbol-paper:#f3e3dd;--symbol-ink:#985749}.sage{--symbol-paper:#e9ecdf;--symbol-ink:#596648}.ochre{--symbol-paper:#f3ead6;--symbol-ink:#876735}.lavender{--symbol-paper:#ece5ee;--symbol-ink:#79647f}.clay{--symbol-paper:#eee2d7;--symbol-ink:#8a6247}.blue{--symbol-paper:#e4eae9;--symbol-ink:#56716e}
    h2{margin:27px 0 7px;font-size:19px;line-height:1.5;font-weight:600;letter-spacing:-.3px}
    .card p{font-size:15px;color:var(--muted);margin:0;line-height:1.8}
    footer{display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid var(--line);margin-top:50px;padding:24px 0 44px;font-size:14px;color:var(--muted)}
    .signature{font-family:Georgia,serif;font-style:italic;font-size:20px;color:#95604a}
    .links{display:flex;align-items:center;flex-wrap:wrap;gap:12px 24px}
    .links a{padding:4px 0;text-underline-offset:5px;text-decoration-thickness:1px}
    .links a:hover{text-decoration:underline;color:var(--accent)}
    @media(min-width:1000px){.page{padding-top:18px}}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding-top:64px}}
    @media(max-width:520px){.page{width:calc(100% - 40px)}header{padding:46px 0 32px}h1{letter-spacing:-1.8px}.grid{grid-template-columns:1fr;gap:14px}.card{min-height:0;padding:23px;display:grid;grid-template-columns:44px 1fr;column-gap:18px;align-items:center}.symbol{width:44px;height:44px;border-radius:13px;grid-row:1/3}h2{margin:0 0 4px;font-size:18px}.card p{grid-column:2;font-size:14px}footer{margin-top:34px;padding-bottom:28px;align-items:flex-start}.links{flex-direction:column;align-items:flex-end;gap:6px;font-size:14px}}
    @media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
  </style>
</head>
<body>

      <article id="bzduel"><a class="card clay" href="https://bzduel.lg37.com" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">D6</span><h2>校园战力党</h2><p>骰子、卡牌，和你的战术。</p></a></article>

    </div></main>

  </div>

</body>
</html>
